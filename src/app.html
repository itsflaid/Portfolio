<!doctype html>
<html lang="en" %sveltekit.body.attributes%>
<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/svg+xml" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script>
		(function () {
			try {
				if (localStorage.getItem('flaid-theme') === 'neo') {
					var r = document.documentElement;
					r.setAttribute('data-theme', 'neo');
					r.setAttribute('data-boot', '');
				}
			} catch (e) {}
		})();
	</script>
	<noscript><style>html[data-boot] body { visibility: visible !important; }</style></noscript>
	%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
